server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/case_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracion del Asistente IA (Ollama / LLM local)
ai.ollama.url=${AI_OLLAMA_URL:http://localhost:11434/api/generate}
ai.ollama.base-url=${AI_OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${AI_OLLAMA_MODEL:gemma2:2b}
ai.ollama.vision-model=${AI_OLLAMA_VISION_MODEL:moondream:latest}
ai.ollama.timeout-seconds=${AI_OLLAMA_TIMEOUT:45}
